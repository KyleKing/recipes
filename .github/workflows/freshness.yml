---
name: Freshness

"on":
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_APP: ${{ secrets.DONERAM_APP_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pkl evaluates .doneram.pkl and mise answers the tool resolvers.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: kyleking/doneram@c5120304a06b6c524a9b96dd6408b01e8b453e65 # v0.5.1
        with:
          version: v0.5.1

      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: doneram update --output /tmp/doneram.json

      # doneram tracks literals, not dependency graphs, so the Dependabot
      # gomod role lives here: bump everything, let tidy settle it, and fold
      # it into the same weekly PR.
      - name: Update Go modules
        id: gomod
        run: |
          set -euo pipefail
          # a dep can demand a newer toolchain than the pin; go get go@X
          # bumps the go directive and auto fetches it for the retry
          if ! go get -u ./... 2>&1 | tee /tmp/gomod.log; then
            ver=$(sed -nE 's/.*requires go >= ([0-9.]+).*/\1/p' /tmp/gomod.log | sort -V | tail -1)
            [ -n "$ver" ] || exit 1
            go get "go@$ver"
            go get -u ./... 2>&1 | tee /tmp/gomod.log
          fi
          go mod tidy
          if git diff --quiet -- go.mod go.sum; then
            echo 'upgrades=false' >> "$GITHUB_OUTPUT"
          else
            echo 'upgrades=true' >> "$GITHUB_OUTPUT"
            {
              echo 'log<<GOMOD_EOF'
              grep -E '^go: (upgraded|added|removed)' /tmp/gomod.log || true
              echo 'GOMOD_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN cannot push a branch that edits .github/workflows/**.
      # When the doneram app is installed with secrets set, its scoped
      # installation token covers that push; otherwise the job token opens
      # the PR and any workflow-file patch fails the push loudly.
      - id: app-token
        if: env.HAS_APP == 'true' && (steps.check.outputs.has_upgrades == 'true' || steps.gomod.outputs.upgrades == 'true')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DONERAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.DONERAM_APP_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.check.outputs.has_upgrades == 'true' || steps.gomod.outputs.upgrades == 'true'
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: chore/doneram-updates
          draft: true
          delete-branch: true
          title: "${{ steps.check.outputs.has_upgrades == 'true' && steps.check.outputs.title || 'chore: update Go modules' }}"
          body: |
            ${{ steps.check.outputs.body }}
            ${{ steps.gomod.outputs.log }}
